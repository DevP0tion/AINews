name: Daily Report

on:
  schedule:
    # 매일 06:30 KST = 21:30 UTC (전날)
    # 미 증시 정규장 마감(06:00 KST, 서머타임 05:00)보다 뒤라 전일 미국 지수 종가가 확정돼 있다
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "대상 날짜 (YYYY-MM-DD, 미입력 시 KST 오늘)"
        required: false
        default: ""

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write    # claude-code-action이 OIDC 토큰을 요구

jobs:
  # ---------------------------------------------------------------------------
  # 1. 결정론적 소스 수집 → inbox/YYYY-MM-DD-raw.json 커밋
  # ---------------------------------------------------------------------------
  collect:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.resolve.outputs.date }}
      inbox_path: ${{ steps.resolve.outputs.inbox }}
      stock_inbox_path: ${{ steps.resolve.outputs.stock_inbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target date (KST)
        id: resolve
        env:
          # 템플릿 직접 전개 대신 env 경유 — 입력이 셸로 흘러들지 않게
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          else
            DATE=$(TZ="Asia/Seoul" date +%Y-%m-%d)
          fi
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::잘못된 날짜 형식: '${DATE}' — YYYY-MM-DD 여야 합니다 (예: 2026-08-07)"
            exit 1
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "inbox=inbox/${DATE}-raw.json" >> "$GITHUB_OUTPUT"
          echo "stock_inbox=inbox/${DATE}-stock-raw.json" >> "$GITHUB_OUTPUT"
          echo "TARGET_DATE=${DATE}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Collect raw data
        env:
          # 무인증 GitHub API는 runner IP 공유로 60req/hr에 걸릴 수 있다
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_data.py

      - name: Collect stock data
        run: python scripts/collect_stock.py

      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/
          if git diff --cached --quiet; then
            echo "변경 없음 (이미 같은 파일 존재)"
            exit 0
          fi
          git commit -m "chore: raw data ${TARGET_DATE}"
          git push origin main

  # ---------------------------------------------------------------------------
  # 2. Claude가 inbox 읽어서 /tmp/processed.json 생성
  #    → 이후 스크립트 실행·커밋은 결정론적 스텝이 담당 (Claude는 토큰에 도달 불가)
  # ---------------------------------------------------------------------------
  curate:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      # 주식 처리 결과. 실패해도 job은 성공으로 끝나므로(AI/IT 전송을 막지 않기 위해)
      # 후속 job은 이 값으로 진행 여부를 판단한다.
      stock_outcome: ${{ steps.stock.outcome }}
    env:
      TARGET_DATE: ${{ needs.collect.outputs.target_date }}
      INBOX_PATH: ${{ needs.collect.outputs.inbox_path }}
      STOCK_INBOX_PATH: ${{ needs.collect.outputs.stock_inbox_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          # Claude가 읽을 수 있는 워크스페이스에 git 자격증명을 남기지 않는다
          persist-credentials: false

      - name: Load prompt
        id: prompt
        run: |
          # curate_prompt.md에 런타임 변수 치환 후 env로 전달
          PROMPT=$(sed \
            -e "s|{{TARGET_DATE}}|${TARGET_DATE}|g" \
            -e "s|{{INBOX_PATH}}|${INBOX_PATH}|g" \
            -e "s|{{STOCK_INBOX_PATH}}|${STOCK_INBOX_PATH}|g" \
            .github/curate_prompt.md)
          {
            echo "prompt<<CURATE_PROMPT_EOF"
            echo "$PROMPT"
            echo "CURATE_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          # --allowedTools는 가산형(base 도구는 항상 포함)이라 실제 차단은 전부
          # --disallowedTools가 담당한다. bare 이름은 도구 자체를 컨텍스트에서 제거,
          # Tool(pattern)은 해당 경로만 거부 (deny가 allow보다 우선).
          claude_args: |
            --allowedTools "Read,Write,WebFetch"
            --disallowedTools "Bash,Edit,WebSearch,mcp__*,Read(./.git/**),Read(~/.claude/**),Write(./**)"
            --add-dir /tmp

      # 아래 스텝들은 전부 Claude 종료 후 실행된다. 토큰은 여기서만 등장한다.
      #
      # 리포트별로 [처리 → 커밋]을 분리한다. 주식 처리가 깨져도 AI/IT 리포트는
      # 이미 커밋·푸시를 마친 뒤이므로 그대로 전송된다.
      - name: Configure git
        env:
          # step 단위 env — 앞선 claude-code-action 스텝에는 노출되지 않는다
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Process report
        run: |
          if [ ! -f /tmp/processed.json ]; then
            echo "::error::/tmp/processed.json 이 없습니다 — curate 단계가 출력을 생성하지 못했습니다"
            exit 1
          fi
          python3 scripts/daily_report.py --date "${TARGET_DATE}" /tmp/processed.json

      - name: Commit & push report
        run: |
          YEAR="${TARGET_DATE%%-*}"
          MONTH=$(echo "${TARGET_DATE}" | cut -d- -f2)
          # 경로를 명시해서 주식 산출물이 이 커밋에 섞이지 않게 한다
          git add \
            "archive/${YEAR}/${MONTH}/${TARGET_DATE}.json" \
            "archive/${YEAR}/${MONTH}/${TARGET_DATE}.md" \
            state/seen_urls.json state/seen_claude.json
          if git diff --cached --quiet; then
            echo "변경 없음 — commit skip"
            exit 0
          fi
          git commit -m "chore: ${TARGET_DATE} report"
          git push origin main

      # 여기부터 실패해도 job은 계속된다 (AI/IT는 위에서 이미 푸시됐다).
      # 실패는 continue-on-error로 삼켜지는 대신 stock_outcome 으로 후속 job에 전달된다.
      - name: Process stock report
        id: stock
        continue-on-error: true
        run: |
          if [ ! -f /tmp/processed_stock.json ]; then
            echo "::error::/tmp/processed_stock.json 이 없습니다 — curate 단계의 파트 2가 출력을 생성하지 못했습니다"
            exit 1
          fi
          python3 scripts/stock_report.py --date "${TARGET_DATE}" /tmp/processed_stock.json

      - name: Commit & push stock report
        if: steps.stock.outcome == 'success'
        run: |
          YEAR="${TARGET_DATE%%-*}"
          MONTH=$(echo "${TARGET_DATE}" | cut -d- -f2)
          git add \
            "archive/${YEAR}/${MONTH}/${TARGET_DATE}-stock.json" \
            state/seen_stock_urls.json
          if git diff --cached --quiet; then
            echo "변경 없음 — commit skip"
            exit 0
          fi
          git commit -m "chore: ${TARGET_DATE} stock report"
          git push origin main

      - name: Report stock failure
        if: steps.stock.outcome != 'success'
        run: |
          echo "::warning::주식 리포트 처리 실패 — AI/IT 리포트는 정상 전송되고 주식 전송만 건너뜁니다"

  # ---------------------------------------------------------------------------
  # 3. Discord 전송 — archive/*.json을 읽어서 webhook으로
  # ---------------------------------------------------------------------------
  publish:
    needs: [collect, curate]
    runs-on: ubuntu-latest
    env:
      REPORT_DATE: ${{ needs.collect.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_POTIONBOT_NEWS: ${{ secrets.DISCORD_WEBHOOK_POTIONBOT_NEWS }}
        run: python scripts/send_discord.py

  # ---------------------------------------------------------------------------
  # 4. 주식 리포트를 HTML 한 장으로 렌더링해서 GitHub Pages에 배포
  #    Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 동작한다.
  # ---------------------------------------------------------------------------
  pages:
    needs: [collect, curate]
    # 주식 처리가 실패했으면 배포할 내용이 없다. AI/IT 전송(publish)은 영향받지 않는다.
    if: needs.curate.outputs.stock_outcome == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    env:
      REPORT_DATE: ${{ needs.collect.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          # curate가 push한 archive/를 받아야 하므로 main 최신을 다시 받는다
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render stock page
        run: python scripts/render_stock_page.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 5. 주식 채널에는 배포된 페이지 링크 한 줄만 보낸다
  # ---------------------------------------------------------------------------
  publish_stock:
    needs: [collect, pages]
    runs-on: ubuntu-latest
    env:
      REPORT_DATE: ${{ needs.collect.outputs.target_date }}
      STOCK_PAGE_URL: ${{ needs.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send stock link to Discord
        env:
          DISCORD_WEBHOOK_POTIONBOT_STOCK: ${{ secrets.DISCORD_WEBHOOK_POTIONBOT_STOCK }}
        run: python scripts/send_discord.py --stock
